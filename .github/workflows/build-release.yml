name: Build Windows Release

on:
  # 手动触发：Actions 页面点击 "Run workflow"
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          npm_config_registry: https://registry.npmmirror.com

      - name: Build Windows artifacts (Portable + Setup)
        run: npx electron-builder --win -c.directories.output=release-dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalMark-Windows
          path: |
            release-dist/*.exe
            release-dist/*.blockmap
            release-dist/latest.yml
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.event.inputs.version, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: LocalMark ${{ github.event.inputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release-dist/*.exe
